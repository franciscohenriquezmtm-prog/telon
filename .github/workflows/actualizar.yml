# Telón — actualización automática de la cartelera.
#
# Dos veces al día, un servidor de GitHub lee los sitios de los teatros, guarda la
# cartelera nueva en el repositorio y republica el sitio. No necesita que el PC de
# nadie esté encendido, y no usa ningún servicio de pago.

name: Actualizar cartelera

on:
  schedule:
    # Dos corridas al día, en UTC. Según si Chile está en horario de verano (UTC-3)
    # o de invierno (UTC-4), caen a las 08:00/07:00 y 19:00/18:00 de Santiago.
    #
    # Antes se disparaban cuatro veces y un job descartaba las que no cayeran justo
    # a las 08 o 19 de Santiago. GitHub lanza los cron con retraso (a veces más de
    # una hora), así que la hora nunca calzaba: el workflow se saltaba SIEMPRE y
    # reportaba "éxito" igual. La cartelera quedó un mes congelada sin que se notara.
    # Por eso ya no se filtra por hora: si la corrida parte, actualiza.
    - cron: '0 11,22 * * *'
  # Botón para correrla a mano desde la pestaña Actions
  workflow_dispatch:
  # Republicar en cuanto cambie algo del sitio. No se listan los archivos que la
  # propia corrida escribe (assets/cartelera.json, assets/img), así no se llama a
  # sí misma.
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'assets/app.js'
      - 'assets/styles.css'
      - 'feriado/**'
      - '.github/workflows/actualizar.yml'

permissions:
  contents: write   # para guardar la cartelera nueva en el repositorio
  pages: write      # para publicar el sitio
  id-token: write

# Que no se pisen dos actualizaciones a la vez
concurrency:
  group: cartelera
  cancel-in-progress: false

jobs:
  # ── Leer los teatros y publicar ─────────────────────────────────────────────
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Para las miniaturas en Linux. Si faltara, el actualizador sigue igual:
      # solo avisa y no genera miniaturas.
      - name: Instalar ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      # --sin-build: dist/telon.html es la versión de un archivo, que no se publica
      # en la web y se regenera a mano cuando haga falta.
      - name: Leer la cartelera de los teatros
        run: node tools/actualizar.mjs --sin-build
        # Si un teatro se cae, el actualizador conserva sus obras de la última
        # corrida buena y termina con código 1. No queremos que eso frene la
        # publicación: el resto de la cartelera sigue estando fresca.
        continue-on-error: true

      # Si mientras la corrida trabaja alguien sube otro commit, GitHub rechaza el
      # push por venir de una copia vieja. Pasó el 13-09-2026 con tres commits en tres
      # minutos. En vez de fallar, se traen los commits nuevos, se pone la cartelera
      # encima y se reintenta. No hay conflicto posible: la corrida solo escribe
      # assets/cartelera.json y assets/img, y el grupo de concurrency impide que otra
      # corrida los toque a la vez. Si aun así algo choca, falla y avisa como antes.
      - name: Guardar la cartelera nueva en el repositorio
        run: |
          git config user.name  "Telón"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cartelera.json assets/img
          if git diff --staged --quiet; then
            echo "La cartelera no cambió desde la última corrida."
            exit 0
          fi
          git commit -m "Cartelera al $(TZ=America/Santiago date '+%d-%m-%Y %H:%M')"

          for intento in 1 2 3; do
            if git push; then exit 0; fi
            echo "Llegaron cambios mientras corría: traigo lo nuevo y reintento ($intento de 3)."
            git pull --rebase origin main
            sleep 5
          done

          echo "No se pudo guardar la cartelera después de 3 intentos."
          exit 1

      # El sitio publicado lleva solo lo que la app necesita para funcionar;
      # los scripts de Node se quedan en el repositorio.
      - name: Armar el sitio
        run: |
          mkdir -p _sitio
          cp index.html manifest.webmanifest sw.js _sitio/
          mkdir -p _sitio/feriado
          cp feriado/index.html feriado/manifest.webmanifest feriado/sw.js feriado/icon.svg _sitio/feriado/
          mkdir -p _sitio/assets
          cp assets/app.js assets/styles.css assets/cartelera.json _sitio/assets/
          cp assets/icon.svg assets/icon-180.png assets/icon-192.png assets/icon-512.png _sitio/assets/
          mkdir -p _sitio/assets/img
          find assets/img -maxdepth 1 -type f -exec cp {} _sitio/assets/img/ \;
          echo "Sitio armado: $(du -sh _sitio | cut -f1)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: despliegue
        uses: actions/deploy-pages@v4

      - name: Resumen
        run: |
          echo "### Cartelera actualizada 🎭" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Obras: $(node -e "console.log(JSON.parse(require('fs').readFileSync('assets/cartelera.json')).obras.length)")" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sitio: ${{ steps.despliegue.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
